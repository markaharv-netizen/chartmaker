services:
  - type: web
    name: chartmaker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /login
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: VIEWS_STORE
        value: server
      - key: GITHUB_TOKEN
        sync: false
      # Full-size Sheets chart PNGs. Paste a Drive-readonly service-account key JSON.
      # Share the three chart PNG folders with that service account's client_email as Viewer.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VIEWS_REPO
        value: markaharv-netizen/chartmaker
      - key: VIEWS_BRANCH
        value: views-data
      - key: PYTHON_VERSION
        value: 3.12.7
