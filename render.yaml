services:
  - type: web
    name: chartmaker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /login
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: VIEWS_STORE
        value: server
      - key: GITHUB_TOKEN
        sync: false
      - key: VIEWS_REPO
        value: markaharv-netizen/chartmaker
      - key: VIEWS_BRANCH
        value: views-data
      - key: PYTHON_VERSION
        value: 3.12.7
