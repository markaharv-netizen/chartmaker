<!doctype html><html><head><meta charset="utf-8"><title>Chartmaker</title>
<script src="echarts.min.js"></script>
<style>
body{font-family:Inter,Arial,sans-serif;margin:0;background:#f4f4f5;color:#111}
#ctl{display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:#fff;border-bottom:1px solid #ddd;align-items:end}
#ctl label{font-size:12px;display:flex;flex-direction:column;gap:3px}
input,select,button{font-size:14px;padding:6px}
button{background:#F7931A;color:#fff;border:0;border-radius:4px;cursor:pointer}
#wrap{padding:16px}#chart{width:1600px;height:900px;background:#fff;transform-origin:0 0}
#mode button{background:#e5e7eb;color:#111;margin-right:4px}#mode button.on{background:#111;color:#fff}
#ftable{margin:0 16px 30px;border-collapse:collapse;font-size:15px;background:#fff}#ftable td,#ftable th{border:1px solid #e5e7eb;padding:4px 10px;text-align:right}#ftable th:first-child,#ftable td:first-child{text-align:left}
#fnote{margin:0 16px 8px;font-size:14px;color:#374151}
#cotd{display:none;padding:16px 16px 40px;max-width:1240px}#cotd h2{margin:0 0 4px;font-size:22px}#cotd .theme{color:#374151;margin:0 0 18px;font-size:15px}
#cotd .card{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:14px;margin-bottom:18px}#cotd .card img{width:100%;max-width:1200px;display:block;cursor:zoom-in;border:1px solid #f0f0f0}
#cotd .card h3{margin:0 0 8px;font-size:17px}#cotd .src{font-size:12px;color:#6B7280;margin:6px 0 10px}#cotd .src a{color:#2563eb}#cotd .sec{margin:6px 0;font-size:14px;line-height:1.45}#cotd .sec b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#6B7280}
#actl{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #ddd;align-items:center;font-size:13px}
#actl label{font-size:13px;flex-direction:row;align-items:center;gap:4px}
#annList{display:flex;flex-wrap:wrap;gap:4px;width:100%}
#sheets{display:none;padding:16px 16px 48px;max-width:1100px}#sheets h2{margin:0 0 4px;font-size:22px}#sheets .theme{color:#374151;margin:0 0 14px;font-size:15px;line-height:1.45}
#sheets .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}#sheets .count{font-size:13px;color:#6B7280;margin:0 0 10px}
#sheets .row{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
#sheets .row .meta{flex:1;min-width:0}#sheets .book{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#6B7280}
#sheets .row h3{margin:2px 0 4px;font-size:16px}#sheets .charts{font-size:13px;color:#374151;line-height:1.4}
#sheets .row a.open{color:#2563eb;font-size:13px;white-space:nowrap}#sheets .row img{width:240px;max-width:42%;height:auto;border:1px solid #f0f0f0;border-radius:4px;background:#fff;cursor:zoom-in}
#status{padding:4px 12px;font-size:13px}#status.err{color:#EF4444;font-weight:bold}
#smabox{position:relative;z-index:30;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
#smaBtn{background:#fff;color:#111;border:1px solid #767676;border-radius:2px;padding:6px 26px 6px 8px;text-align:left;min-width:9.5em;line-height:1.2;position:relative;white-space:nowrap}
#smaBtn:hover,#smaBtn[aria-expanded=true]{border-color:#111}
#smaBtn::after{content:"";position:absolute;right:9px;top:50%;margin-top:-2px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid #333;pointer-events:none}
#smaMenu{position:absolute;z-index:40;top:calc(100% + 2px);left:0;background:#fff;color:#111;border:1px solid #ccc;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.18);min-width:100%;max-width:calc(100vw - 16px);padding:4px 0;max-height:70vh;overflow:auto}
#smaMenu[hidden]{display:none !important}
#smaMenu label{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:14px;padding:8px 12px;cursor:pointer;white-space:nowrap}
#smaMenu label:hover,#smaMenu label:focus-within{background:#f3f4f6}
#smaMenu input[type=checkbox]{width:16px;height:16px;margin:0;flex:none}
#smacrow{border-top:1px solid #e5e7eb;margin-top:4px}
#smac{width:76px;padding:4px 6px}
/* Hint sits beside Type, not under it, so it does not push that select off the row baseline. */
#typebox{align-items:flex-start}
#typebox .type-line{display:flex;align-items:center;gap:8px}
#ctypeNote{font-size:11px;line-height:1.2;color:#6B7280;font-weight:400;white-space:nowrap}
#ctypeNote:empty{display:none}
#ctl > label input[type=checkbox]{margin:0}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const chart=echarts.init($('chart'),null,{renderer:'canvas'});
// PNG export never includes the hover crosshair/tooltip: hide them before snapshotting
{const g=chart.getDataURL.bind(chart);chart.getDataURL=o=>{try{chart.dispatchAction({type:'hideTip'});chart.dispatchAction({type:'updateAxisPointer',currTrigger:'leave'})}catch(e){}return g(o)}}
const PALETTE=['#F7931A','#8B5CF6','#0EA5E9','#22C55E','#EF4444','#111827','#EC4899','#14B8A6'];
const DAY=86400;
const THEMES={
 white:{name:'White',bg:'#FFFFFF',title:'#111111',text:'#374151',src:'#6B7280',wm:'#9CA3AF',grid:'#EEEEEE',axis:'#999999',dark:0},
 cream:{name:'Off-white / cream',bg:'#FAF7F2',title:'#1F1A14',text:'#4B4237',src:'#7A6F62',wm:'#A89D8F',grid:'#ECE6DC',axis:'#B5AB9C',dark:0},
 gray:{name:'Light gray',bg:'#F5F6F8',title:'#111827',text:'#374151',src:'#6B7280',wm:'#9CA3AF',grid:'#E3E6EB',axis:'#A3A9B3',dark:0},
 dark:{name:'Dark',bg:'#0F1115',title:'#F3F4F6',text:'#C9CED6',src:'#8B93A1',wm:'#6B7280',grid:'#232730',axis:'#3A404C',dark:1},
 navy:{name:'Navy',bg:'#0B1A2E',title:'#F1F5F9',text:'#C3CEDD',src:'#8798B0',wm:'#5F7392',grid:'#1A2C46',axis:'#33496A',dark:1},
 black:{name:'Black (X dark)',bg:'#000000',title:'#E7E9EA',text:'#C4C9CE',src:'#8B98A5',wm:'#5B6670',grid:'#1C1F23',axis:'#333639',dark:1}};
const BRIGHT={'#F7931A':'#FFA033','#8B5CF6':'#A78BFA','#22C55E':'#34D671','#EF4444':'#F87171','#0EA5E9':'#38BDF8','#111827':'#E5E7EB','#EC4899':'#F472B6','#14B8A6':'#2DD4BF'};
let T=THEMES.white;
function bc(c){return T.dark&&BRIGHT[c]?BRIGHT[c]:c}
function applyTheme(){T=THEMES[$('theme').value]||THEMES.white;axLabel={fontSize:16,color:T.text};split={lineStyle:{color:T.grid}};
  $('chart').style.background=T.bg;$('tprev').style.background=T.bg;$('tprev').style.color=T.title;
  $('tprev').innerHTML=`Aa <b style="color:${bc('#F7931A')}">■</b><b style="color:${bc('#8B5CF6')}">■</b><b style="color:${bc('#22C55E')}">■</b><b style="color:${bc('#EF4444')}">■</b>`}
function rerender(){return MODE==='sheets'||MODE==='cotd'?null:MODE==='sent'?sdraw():MODE==='watch'?wdraw():MODE==='val'?vrender():MODE==='tre'?trender():MODE==='fin'?frender():MODE==='heat'?hrender():render()}

function rangeParams(){
  const r=$('range').value, now=Math.floor(Date.now()/1000), d=new Date();
  let p1, p2=now, iv='1d';
  let rng='';
  if(r==='1D'){p1=now-DAY;iv='1m';rng='1d'} else if(r==='5D'){p1=now-5*DAY;iv='1m';rng='5d'}
  else if(r==='YTD'){p1=Date.UTC(d.getUTCFullYear()-1,11,31)/1000}
  else if(r==='1M'){p1=now-31*DAY} else if(r==='6M'){p1=now-183*DAY}
  else if(r==='1Y'){p1=now-366*DAY} else if(r==='5Y'){p1=now-5*366*DAY;iv='1wk'}
  else if(r==='Max'){p1=0;iv='1mo'}
  else {p1=Date.parse($('start').value)/1000; p2=$('end').value?Date.parse($('end').value)/1000+DAY:now;
        if(isNaN(p1))throw Error('Pick a custom start date'); if((p2-p1)>3*366*DAY)iv='1wk'}
  return {p1,p2,iv,r,rng};
}
let FRESH=false;
async function fetchSym(s,p){
  // Line charts on 1D/5D pass a Yahoo range and want extended hours. Candle mode sets prepost:false.
  const ex=p.rng?`&range=${p.rng}${p.prepost!==false?'&prepost=1':''}`:'';
  const res=await fetch(`/api/chart?symbol=${encodeURIComponent(s)}&period1=${p.p1}&period2=${p.p2}&interval=${p.iv}${ex}${FRESH?'&fresh=1':''}`,{cache:'no-store'});
  const j=await res.json(); if(!res.ok||j.error)throw Error(`${s}: ${j.error||res.status}`); return j;
}
// YTD baseline = last close of prior year: keep the last point dated before Jan 1, drop earlier ones
function trimYTD(pts,r){if(r!=='YTD')return pts;const jan1=Date.UTC(new Date().getUTCFullYear(),0,1);
  const i=pts.findIndex(p=>p[0]>=jan1);return i>0?pts.slice(i-1):pts}
function fmtNum(v){const a=Math.abs(v);return a>=1000?v.toLocaleString(undefined,{maximumFractionDigits:0}):a>=1?v.toFixed(2):v.toPrecision(3)}
function pct(v){return (v>=0?'+':'')+v.toFixed(1)+'%'}
// ---------- Simple moving averages (daily closes, extra lookback so lines start at left edge) ----------
const SMA_COL={'SMA 20':'#94A3B8','SMA 50':'#64748B','SMA 100':'#0D9488','SMA 200':'#0369A1','SMA 200W':'#BE185D'};
function smaList(){const L=[];for(const n of [20,50,100,200])if($('sma'+n).checked)L.push({n,w:0,key:'SMA '+n});

async function hprice(sym,p1,p2,iv='1wk'){const k=sym+p1+iv;if(HPRICE[k])return HPRICE[k];  // weekly closes through the normal /api/chart path (same fallbacks as Prices)

  const src='Source: X posts only (no news), '+fmtD(t0)+' – '+fmtD(t1)+' · '+(day?'daily':'weekly')+' bull share (engagement-weighted) · shaded = 95% band · hollow = thin '+(day?'day':'week')+(day?' · gaps = no data collected':'')+(anyP?' · dashed = '+(day?'daily':'weekly')+' close'+(single?'':', % from start')+' (Yahoo)':'');

  o.yAxis=[{type:'value',min:0,max:100,interval:25,axisLabel:{...axLabel,formatter:v=>v+'%'},splitLine:split,name:'Bull share',nameTextStyle:{color:T.src,fontSize:14}},
    ...(anyP?[{type:'value',scale:true,position:'right',offset:anyP?0:0,axisLabel:{...axLabel,formatter:pfmt},splitLine:{show:false},name:single?'Price':'Price, % from start',nameTextStyle:{color:T.src,fontSize:14}}]:[])];
  o.series=S;
  o.tooltip={trigger:'axis',confine:true,transitionDuration:0,backgroundColor:T.dark?'rgba(23,26,32,0.95)':'rgba(255,255,255,0.97)',borderColor:T.axis,textStyle:{color:T.text,fontSize:14},
    extraCssText:'box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:6px',axisPointer:{type:'line',lineStyle:{color:T.axis,width:1,type:'dashed'},label:{show:false}},
    formatter:ps=>{const x=[].concat(ps)[0];if(!x)return'';const at=x.axisValue;let h='',hd='';

// ---------- Themes + saved views (server views.json, or browser localStorage when VIEWS_STORE=browser) ----------
const VFIELDS=['sview','shgran','shist','sprice','stickers','stitle','swm','wtitle','wwm','hsize','hshow','vview','vrange','vtickers','vmetric','vsort','vnames','vtitle','vcolor','vwm','ttickers','tmetric','ttitle','tcolor','twm','tickers','names','range','start','end','type','title','color','wm','ftickers','fnames','fmetric','fperiod','fy1','fy2','ftype','ftitle','fcolor','fwm','theme','huni','htickers','hrange','hsector','hstable','htitle','hwm','sma20','sma50','sma100','sma200','sma200w','smac','ddbase','annOn','annEarn','annHalf'];
let VIEWS=[];
function snap(name){const f={};for(const id of VFIELDS){const e=$(id);f[id]=e.type==='checkbox'?e.checked:e.value}const now=new Date().toISOString(),o={name,mode:MODE,fields:f,saved:now,updated:now};if(MODE==='watch')o.wl=WL.slice();if(MODE==='prices')o.ann=ANN.map(a=>({date:a.date,label:a.label,note:a.note||''}));return o}
let VSTORE='server';const VLS='chartmaker_views',VLAST='chartmaker_lastview';
// Saved views are per tab: each view carries .mode and only shows/saves/loads in that tab.
const VMODES=['prices','fin','heat','tre','val','watch','sent'];
const vmode=x=>VMODES.includes(x&&x.mode)?x.mode:'prices';
// Fields each tab owns; applying a view only touches its own tab's fields (+ theme), so other tabs are left alone.
const VOWN={sent:/^(sview|shist|sprice|stickers|stitle|swm)$/,watch:/^(wtitle|wwm)$/,heat:/^h/,val:/^v/,tre:/^t(?!itle$|ype$|ickers$|heme$)/,fin:/^f/,prices:/^(tickers|names|range|start|end|type|title|color|wm|sma.*|ddbase|annOn|annEarn|annHalf)$/};
// Session-only memory of each tab's selected view: a page load/refresh always starts every tab at "— pick a view —".
const VLASTM={};try{localStorage.removeItem(VLAST)}catch(e){}
function vremember(name){if(name)VLASTM[MODE]=name;else delete VLASTM[MODE]}
const vfind=(n,m=MODE)=>VIEWS.findIndex(v=>v.name===n&&vmode(v)===m);
// Server mode: views.json on the server (GitHub-backed), with this browser's localStorage kept as an offline cache.
async function vput(){localStorage.setItem(VLS,JSON.stringify(VIEWS));if(VSTORE==='browser'){vlist();return}
  try{const r=await fetch('/api/views',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(VIEWS)});
    if(!r.ok)throw Error('status '+r.status);VIEWS=await r.json();localStorage.setItem(VLS,JSON.stringify(VIEWS))}
  catch(e){vlist();vmsg('⚠ Saved in this browser only — server sync failed ('+e.message+'). Save again to retry.');throw e}vlist()}
async function vload(){try{VSTORE=(await (await fetch('/api/config')).json()).viewsStore||'server'}catch(e){}window.__VSTORE=VSTORE;
  let loc=[];try{loc=JSON.parse(localStorage.getItem(VLS)||'[]');if(!Array.isArray(loc))loc=[]}catch(e){}
  if(VSTORE==='browser')VIEWS=loc;
  else try{const MIG='chartmaker_views_uploaded';let d;
    // first load in this browser: upload its saved views + watchlist (merge by tab+name, newest wins, nothing deleted)
    if(!localStorage.getItem(MIG)){const r=await fetch('/api/views/merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({views:loc.filter(x=>x&&x.name),watchlist:localStorage.getItem(WLS)?{list:WL,updated:WLUP||'0'}:null})});
      if(!r.ok)throw Error('merge '+r.status);d=await r.json();localStorage.setItem(MIG,new Date().toISOString())}
    else{const r=await fetch('/api/views/all',{cache:'no-store'});if(!r.ok)throw Error('load '+r.status);d=await r.json()}
    VIEWS=Array.isArray(d.views)?d.views:[];localStorage.setItem(VLS,JSON.stringify(VIEWS));
    const w=d.watchlist;if(w&&Array.isArray(w.list)&&w.list.length&&String(w.updated||'')>=WLUP&&JSON.stringify(w.list)!==JSON.stringify(WL)){WL=w.list.slice();WLUP=String(w.updated||'');localStorage.setItem(WLS+'_updated',WLUP);wsave(false);if(MODE==='watch')wenter()}}
  catch(e){VIEWS=loc;console.warn('views server unavailable, using browser cache',e);setTimeout(()=>vmsg('⚠ Saved views server unavailable — showing this browser’s cached copy.'),0)}
  if(!Array.isArray(VIEWS))VIEWS=[]
  // migrate old views: anything without a valid tab goes under Prices (nothing is dropped)
  let mig=0;for(const x of VIEWS){if(x&&typeof x==='object'&&x.mode!==vmode(x)){x.mode=vmode(x);mig++}}
  if(mig){try{await vput()}catch(e){console.warn('view migration not saved',e)}}
  vlist()}
function vlist(){try{wlpicklist()}catch(e){}const v=$('views');if(!v)return;const own=VIEWS.map((x,i)=>[x,i]).filter(([x])=>vmode(x)===MODE);
  v.innerHTML='<option value="">— pick a view —</option>'+own.map(([x,i])=>`<option value="${i}">${String(x.name).replace(/</g,'&lt;')}</option>`).join('');
  const i=VLASTM[MODE]?vfind(VLASTM[MODE]):-1;v.value=i>=0?String(i):''}
// "Load from Watchlist": copies a Watchlist view's tickers into this tab's ticker box. Read-only; never adds to this tab's saved views.
const WLIN={prices:'tickers',fin:'ftickers',heat:'htickers',tre:'ttickers',val:'vtickers',sent:'stickers'};
function wlpicklist(){const p=$('wlpick');if(!p)return;const box=$('wlpickbox');box.style.display=WLIN[MODE]?'':'none';
  const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  p.innerHTML='<option value="">— watchlist view —</option><option value="cur">Current watchlist ('+WL.length+')</option>'+VIEWS.map((x,i)=>[x,i]).filter(([x])=>vmode(x)==='watch').map(([x,i])=>Array.isArray(x.wl)&&x.wl.length?`<option value="${i}">${esc(x.name)} (${x.wl.length})</option>`:`<option value="${i}" disabled>${esc(x.name)} (no tickers saved — re-save on Watchlist)</option>`).join('');p.value=''}
$('wlpick').onchange=()=>{const p=$('wlpick'),v=p.value,id=WLIN[MODE];p.value='';if(!v||!id)return;
  const x=v==='cur'?{wl:WL}:VIEWS[v];if(!x||!Array.isArray(x.wl)||!x.wl.length)return;
  $(id).value=x.wl.join(',');if(MODE==='heat')$('huni').value='custom';if(MODE==='prices'&&$('names'))$('names').value='';if(MODE==='fin'&&$('fnames'))$('fnames').value='';if(MODE==='val'&&$('vnames'))$('vnames').value='';rerender()};
const WMID={prices:'wm',fin:'fwm',heat:'hwm',tre:'twm',val:'vwm',watch:'wwm',sent:'swm'};
function vapply(x){const m=vmode(x),own=VOWN[m];if(m==='prices'){for(const id of ['sma20','sma50','sma100','sma200','sma200w'])$(id).checked=false;$('smac').value='';$('ddbase').value='range';
  $('annOn').checked=false;$('annHalf').checked=false;$('annEarn').checked=true;
  ANN=(Array.isArray(x.ann)?x.ann:[]).filter(a=>a&&a.date&&a.label).slice(0,40).map(a=>({date:String(a.date),label:String(a.label).slice(0,24),note:String(a.note||'').slice(0,80)}));annsave()}
  // Watermark defaults off. A view that omits the field keeps that default; an explicit true/false still wins.

  for(const [id,val] of Object.entries(x.fields||{})){if(id!=='theme'&&!own.test(id))continue;const e=$(id);if(!e)continue;if(e.type==='checkbox')e.checked=!!val;else e.value=val}
  if(m==='watch'&&Array.isArray(x.wl)&&x.wl.length){WL=x.wl.slice();wsave()}

const vmsg=t=>{$('status').className='';$('status').textContent=t};
const vflash=t=>{vmsg(t);setTimeout(()=>{if($('status').textContent===t)$('status').textContent=''},2500)};
const vsel=()=>{const i=$('views').value;return i!==''&&VIEWS[i]&&vmode(VIEWS[i])===MODE?i:''};
$('views').onchange=()=>{const i=vsel();if(i===''){vremember('');return}const x=VIEWS[i];vremember(x.name);vapply(x)};
$('vsave').onclick=async()=>{const i=vsel();
  // a view is selected in this tab: overwrite it right away with the current settings
  if(i!==''){const n=VIEWS[i].name;VIEWS[i]=snap(n);vremember(n);await vput();vflash('Saved “'+n+'”');return}
  const n=(prompt('Name for this view:')||'').trim();if(!n)return;
  const j=vfind(n);if(j>=0&&!confirm(`Overwrite "${n}"?`))return;
  if(j>=0)VIEWS[j]=snap(n);else VIEWS.push(snap(n));vremember(n);await vput();vflash('Saved “'+n+'”')};

  const n=(prompt('New name:',VIEWS[i].name)||'').trim();if(!n||n===VIEWS[i].name)return;if(vfind(n)>=0){alert(`A view named "${n}" already exists in this tab`);return}
  VIEWS[i].name=n;VIEWS[i].updated=new Date().toISOString();vremember(n);await vput()};
$('vdel').onclick=async()=>{const i=vsel();if(i===''){alert('Pick a saved view first');return}
  if(!confirm(`Delete "${VIEWS[i].name}"?`))return;VIEWS.splice(i,1);vremember('');await vput()};

window.__vapply=vapply;window.__snap=snap;

// ---------- Ticker autocomplete: suggestions for the token being typed in comma-separated ticker inputs ----------
(function(){const IDS=['tickers','ftickers','htickers','ttickers','vtickers','stickers','wadd'];
  const box=document.createElement('div');box.id='acbox';box.style.cssText='position:absolute;z-index:9999;background:#fff;border:1px solid #d1d5db;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.15);font:13px system-ui,sans-serif;display:none;min-width:260px;max-width:420px';document.body.appendChild(box);
  let inp=null,items=[],sel=-1,timer=null,seq=0;const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tok=e=>{const v=e.value,c=e.selectionStart??v.length,a=v.lastIndexOf(',',c-1)+1,bi=v.indexOf(',',c),b=bi<0?v.length:bi;return{a,b,t:v.slice(a,b).trim()}};
  const hide=()=>{box.style.display='none';items=[];sel=-1};
  const show=()=>{if(!items.length||!inp)return hide();const r=inp.getBoundingClientRect();box.style.left=(r.left+scrollX)+'px';box.style.top=(r.bottom+scrollY+2)+'px';
    box.innerHTML=items.map((x,i)=>`<div data-i="${i}" style="padding:5px 8px;cursor:pointer;${i===sel?'background:#e5e7eb':''}">${esc(x.name)} — <b>${esc(x.symbol)}</b>${x.exch?' <span style="color:#6B7280">('+esc(x.exch)+')</span>':''}</div>`).join('');box.style.display='block'};
  const pick=i=>{const x=items[i];if(!x||!inp)return;const {a,b}=tok(inp),v=inp.value,pre=v.slice(0,a),post=v.slice(b);
    inp.value=pre+(pre&&!/\s$/.test(pre)&&pre.endsWith(',')?'':'')+x.symbol+post;const c=(pre+x.symbol).length;inp.setSelectionRange(c,c);hide();inp.focus()};
  async function look(e){const {t}=tok(e),my=++seq;if(t.length<2){hide();return}
    try{const j=await (await fetch('/api/search?q='+encodeURIComponent(t))).json();if(my!==seq||inp!==e)return;items=Array.isArray(j)?j:[];sel=-1;show()}catch(_){hide()}}
  box.addEventListener('mousedown',ev=>{const d=ev.target.closest('[data-i]');if(d){ev.preventDefault();pick(+d.dataset.i)}});
  for(const id of IDS){const e=$(id);if(!e)continue;e.setAttribute('autocomplete','off');
    e.addEventListener('input',()=>{inp=e;clearTimeout(timer);timer=setTimeout(()=>look(e),200)});
    e.addEventListener('blur',()=>setTimeout(()=>{if(inp===e)hide()},150));
    // capture phase so Enter picks a suggestion instead of submitting/rendering
    e.addEventListener('keydown',ev=>{if(box.style.display==='none'||inp!==e)return;
      if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();sel=(sel+(ev.key==='ArrowDown'?1:-1)+items.length)%items.length;show()}
      else if((ev.key==='Enter'||ev.key==='Tab')&&sel>=0){ev.preventDefault();ev.stopImmediatePropagation();pick(sel)}
      else if(ev.key==='Escape'){ev.preventDefault();hide()}
      else if(ev.key==='Enter'){hide()}},true)}
})();
